name: Run NVX microVM tests

on:
  workflow_call:
    inputs:
      display-name:
        description: Platform name shown in the job list
        required: true
        type: string
      runner:
        description: JSON array of labels selecting the test runner
        required: true
        type: string
      backend:
        description: NVX backend to test
        required: true
        type: string
      openvmm-artifact:
        description: Base name of the compatible OpenVMM artifacts
        required: true
        type: string
    secrets:
      OPENVMM_DEPLOY_KEY:
        description: SSH deploy key used to checkout OpenVMM
        required: true

permissions:
  contents: read

jobs:
  test:
    name: NVX microVM tests / ${{ inputs.display-name }}
    runs-on: ${{ fromJSON(inputs.runner) }}
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Validate runner
        uses: ./.github/actions/validate-runner
        with:
          backend: ${{ inputs.backend }}

      - name: Validate NVX CLI
        uses: ./.github/actions/validate-nvx

      - name: Checkout OpenVMM
        uses: ./.github/actions/checkout-openvmm
        with:
          ssh-key: ${{ secrets.OPENVMM_DEPLOY_KEY }}

      - name: Set up retrying curl
        uses: ./.github/actions/setup-curl

      - name: Download guest artifacts
        uses: actions/download-artifact@v8
        with:
          name: guest-artifacts
          path: build

      - name: Download OpenVMM executable
        uses: actions/download-artifact@v8
        with:
          name: ${{ inputs.openvmm-artifact }}-executable
          path: openvmm/target/release

      - name: Download OpenVMM provenance
        uses: actions/download-artifact@v8
        with:
          name: ${{ inputs.openvmm-artifact }}-provenance
          path: build

      - name: Make OpenVMM executable
        if: runner.os != 'Windows'
        shell: bash
        run: chmod +x openvmm/target/release/openvmm

      - name: Run NVX microVM tests on Linux
        if: runner.os != 'Windows'
        shell: bash
        run: >-
          python3 scripts/nvx.py test-microvm
          --backend "${{ inputs.backend }}"
          --output-dir "build/test-results/microvm-${{ inputs.backend }}"

      - name: Run NVX microVM tests on Windows
        if: runner.os == 'Windows'
        shell: powershell
        run: >-
          python scripts\nvx.py test-microvm
          --backend "${{ inputs.backend }}"
          --output-dir "build/test-results/microvm-${{ inputs.backend }}"

      - name: Run Ubuntu guest smoke tests on Linux
        if: runner.os != 'Windows'
        shell: bash
        run: >-
          python3 scripts/nvx.py test-microvm
          --backend "${{ inputs.backend }}"
          --guest ubuntu
          --processors 1
          --scenario guest-boot
          --scenario guest-identity
          --scenario console-exit
          --scenario lifecycle
          --scenario virtio-net
          --scenario filesystem-snapshot
          --output-dir "build/test-results/ubuntu-${{ inputs.backend }}"

      - name: Run Ubuntu guest smoke tests on Windows
        if: runner.os == 'Windows'
        shell: powershell
        run: >-
          python scripts\nvx.py test-microvm
          --backend "${{ inputs.backend }}"
          --guest ubuntu
          --processors 1
          --scenario guest-boot
          --scenario guest-identity
          --scenario console-exit
          --scenario lifecycle
          --scenario virtio-net
          --scenario filesystem-snapshot
          --output-dir "build/test-results/ubuntu-${{ inputs.backend }}"

      - name: Run extended Ubuntu guest tests on Linux/KVM
        if: inputs.backend == 'kvm'
        shell: bash
        run: >-
          python3 scripts/nvx.py test-microvm
          --backend kvm
          --guest ubuntu
          --scenario managed-lifecycle
          --scenario network-snapshot
          --scenario smp
          --scenario snapshot-core
          --scenario workload-identity
          --output-dir "build/test-results/ubuntu-kvm-extended"

      - name: Run Ubuntu sandbox layer smoke test on Linux
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          uuid=$(
            python3 -c 'import json; print(json.load(open("build/ubuntu-distro.erofs.manifest.json", encoding="utf-8"))["uuid"])'
          )
          scratch="build/ubuntu-smoke-${{ inputs.backend }}.ext4"
          cp --reflink=auto build/ubuntu-smoke-scratch.ext4 "${scratch}"
          python3 scripts/nvx.py sandbox \
            --hypervisor "${{ inputs.backend }}" \
            --layer "distro,build/ubuntu-distro.erofs,${uuid}" \
            --scratch "${scratch}" \
            --entrypoint /sbin/nvx-sandbox-smoke \
            --workload-user 65534:65534 \
            --memory-mib 256

      - name: Run Ubuntu sandbox live-share smoke test on Linux
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          uuid=$(
            python3 -c 'import json; print(json.load(open("build/ubuntu-distro.erofs.manifest.json", encoding="utf-8"))["uuid"])'
          )
          scratch="build/ubuntu-share-${{ inputs.backend }}.ext4"
          share="build/ubuntu-share-${{ inputs.backend }}"
          cp --reflink=auto build/ubuntu-smoke-scratch.ext4 "${scratch}"
          rm -rf "${share}"
          mkdir -p "${share}/nvx-denied"
          printf 'host-to-guest\n' >"${share}/nvx-host-marker"
          printf 'secret\n' >"${share}/nvx-denied/secret"
          chmod 0777 "${share}"
          python3 scripts/nvx.py sandbox \
            --hypervisor "${{ inputs.backend }}" \
            --layer "distro,build/ubuntu-distro.erofs,${uuid}" \
            --scratch "${scratch}" \
            --mount "/workspace,${share},rw" \
            --mount-deny nvx-denied \
            --entrypoint /sbin/nvx-sandbox-smoke \
            --arg /workspace \
            --arg rw \
            --workload-user 65534:65534 \
            --memory-mib 256
          test "$(cat "${share}/nvx-guest-marker")" = guest-to-host
          test -d "${share}/nvx-guest-directory"
          rm -rf "${share}/nvx-guest-marker" "${share}/nvx-guest-directory"
          cp --reflink=auto build/ubuntu-smoke-scratch.ext4 "${scratch}"
          python3 scripts/nvx.py sandbox \
            --hypervisor "${{ inputs.backend }}" \
            --layer "distro,build/ubuntu-distro.erofs,${uuid}" \
            --scratch "${scratch}" \
            --mount "/opt/hostedtoolcache,${share},ro" \
            --mount-deny nvx-denied \
            --entrypoint /sbin/nvx-sandbox-smoke \
            --arg /opt/hostedtoolcache \
            --arg ro \
            --workload-user 65534:65534 \
            --memory-mib 256
          test ! -e "${share}/nvx-guest-marker"
          rm -rf "${share}" "${scratch}"

      - name: Run Ubuntu sandbox layer smoke test on Windows
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $manifest = Get-Content -Raw build\ubuntu-distro.erofs.manifest.json |
              ConvertFrom-Json
          $scratch = "build\ubuntu-smoke-${{ inputs.backend }}.ext4"
          Copy-Item build\ubuntu-smoke-scratch.ext4 $scratch
          python scripts\nvx.py sandbox `
            --hypervisor "${{ inputs.backend }}" `
            --layer "distro,build\ubuntu-distro.erofs,$($manifest.uuid)" `
            --scratch $scratch `
            --entrypoint /sbin/nvx-sandbox-smoke `
            --workload-user 65534:65534 `
            --memory-mib 256

      - name: Run Ubuntu sandbox live-share smoke test on Windows
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $manifest = Get-Content -Raw build\ubuntu-distro.erofs.manifest.json |
              ConvertFrom-Json
          $scratch = "build\ubuntu-share-${{ inputs.backend }}.ext4"
          $share = Join-Path $PWD "build\ubuntu-share-${{ inputs.backend }}"
          Copy-Item -Force build\ubuntu-smoke-scratch.ext4 $scratch
          if (Test-Path $share) { Remove-Item -Recurse -Force $share }
          New-Item -ItemType Directory -Force (Join-Path $share "nvx-denied") | Out-Null
          [IO.File]::WriteAllText((Join-Path $share "nvx-host-marker"), "host-to-guest`n")
          [IO.File]::WriteAllText((Join-Path $share "nvx-denied\secret"), "secret`n")
          python scripts\nvx.py sandbox `
            --hypervisor "${{ inputs.backend }}" `
            --layer "distro,build\ubuntu-distro.erofs,$($manifest.uuid)" `
            --scratch $scratch `
            --mount "/workspace,$share,rw" `
            --mount-deny nvx-denied `
            --entrypoint /sbin/nvx-sandbox-smoke `
            --arg /workspace `
            --arg rw `
            --workload-user 65534:65534 `
            --memory-mib 256
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $marker = [IO.File]::ReadAllText((Join-Path $share "nvx-guest-marker"))
          if ($marker -ne "guest-to-host`n") { throw "guest write did not reach the host" }
          if (-not (Test-Path (Join-Path $share "nvx-guest-directory") -PathType Container)) {
              throw "guest directory did not reach the host"
          }
          Remove-Item -Recurse -Force (Join-Path $share "nvx-guest-marker"), (Join-Path $share "nvx-guest-directory")
          Copy-Item -Force build\ubuntu-smoke-scratch.ext4 $scratch
          python scripts\nvx.py sandbox `
            --hypervisor "${{ inputs.backend }}" `
            --layer "distro,build\ubuntu-distro.erofs,$($manifest.uuid)" `
            --scratch $scratch `
            --mount "/opt/hostedtoolcache,$share,ro" `
            --mount-deny nvx-denied `
            --entrypoint /sbin/nvx-sandbox-smoke `
            --arg /opt/hostedtoolcache `
            --arg ro `
            --workload-user 65534:65534 `
            --memory-mib 256
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (Test-Path (Join-Path $share "nvx-guest-marker")) { throw "read-only share accepted a write" }
          Remove-Item -Recurse -Force $share, $scratch

      - name: Upload NVX microVM failure logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: nvx-microvm-tests-${{ inputs.backend }}
          path: |
            build/test-results/microvm-${{ inputs.backend }}
            build/test-results/ubuntu-${{ inputs.backend }}
            build/test-results/ubuntu-kvm-extended
          if-no-files-found: warn
